services:
  postgres:
    image: postgres:16-alpine
    container_name: globetrotter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - globetrotter_pgdata:/var/lib/postgresql/data

volumes:
  globetrotter_pgdata:
